name: Build and publish programme service image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check programme and UTC publication regressions
        run: |
          python -m pip install -r requirements.txt
          TZ=Pacific/Honolulu python -m unittest discover -s tests -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/myota-platform/myota-programme-service:latest
